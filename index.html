```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>Focus App</title>

<!-- PWA / iOS polish -->
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root {
  --bg: #0b0f14;
  --card: rgba(255,255,255,0.05);
  --text: #ffffff;
  --text2: #a0a7b4;
  --blue: #0a84ff;
}

/* Base */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  background: radial-gradient(circle at top, #0f1720, #05080c);
  color: var(--text);
  padding-top: env(safe-area-inset-top);
}

/* Header */
.header {
  padding: calc(env(safe-area-inset-top) + 16px) 16px 20px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
}

.header h1 {
  margin: 6px 0 0;
  font-size: 32px;
  font-weight: 700;
  color: var(--blue);
}

.header p {
  margin: 0;
  color: var(--text2);
}

/* Tabs */
.tabs {
  display: flex;
  margin: 12px 16px;
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 4px;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 8px;
  border-radius: 12px;
  color: var(--text2);
}

.tab.active {
  background: rgba(255,255,255,0.1);
  color: white;
}

/* Calendar Card */
.calendar-card {
  margin: 16px;
  padding: 16px;
  border-radius: 24px;
  background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
}

/* Month header */
.month-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.month-header button {
  background: rgba(255,255,255,0.08);
  border: none;
  color: white;
  padding: 10px;
  border-radius: 12px;
  font-size: 16px;
}

/* Weekdays */
.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 6px;
  font-size: 12px;
  color: var(--text2);
  text-align: center;
}

/* Calendar Grid */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

/* Day cells */
.day {
  aspect-ratio: 1 / 1;
  width: 100%;
  border-radius: 12px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--text2);
  transition: 0.2s ease;
}

/* Hover (nice touch on desktop) */
.day:hover {
  background: rgba(255,255,255,0.08);
}

/* Selected day */
.day.selected {
  background: rgba(10,132,255,0.2);
  border: 1px solid rgba(10,132,255,0.6);
  box-shadow: 0 0 0 1px rgba(10,132,255,0.2) inset;
  color: white;
}

/* Empty cells */
.day.empty {
  background: transparent;
}

/* Stats */
.stats {
  display: flex;
  gap: 12px;
  margin: 16px;
}

.stat {
  flex: 1;
  text-align: center;
  padding: 16px;
  border-radius: 16px;
  background: var(--card);
}

.stat h2 {
  margin: 0;
}

.stat p {
  margin: 4px 0 0;
  font-size: 12px;
  color: var(--text2);
}

/* Floating button */
.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: white;
  box-shadow: 0 10px 30px rgba(10,132,255,0.4);
}
</style>
</head>

<body>

<div class="header">
  <p>Good afternoon 👋</p>
  <h1>utsab</h1>
</div>

<div class="tabs">
  <div class="tab">Today</div>
  <div class="tab active">Month</div>
  <div class="tab">Year</div>
</div>

<div class="calendar-card">
  <div class="month-header">
    <button onclick="changeMonth(-1)">‹</button>
    <h3 id="monthLabel"></h3>
    <button onclick="changeMonth(1)">›</button>
  </div>

  <div class="weekdays">
    <div>S</div><div>M</div><div>T</div><div>W</div>
    <div>T</div><div>F</div><div>S</div>
  </div>

  <div class="cal-grid" id="calendar"></div>
</div>

<div class="stats">
  <div class="stat">
    <h2>0</h2>
    <p>ACTIVE DAYS</p>
  </div>
  <div class="stat">
    <h2>0</h2>
    <p>PERFECT DAYS</p>
  </div>
  <div class="stat">
    <h2>0%</h2>
    <p>AVG. DONE</p>
  </div>
</div>

<div class="fab">+</div>

<script>
let currentDate = new Date();

function renderCalendar() {
  const calendar = document.getElementById("calendar");
  const label = document.getElementById("monthLabel");

  calendar.innerHTML = "";

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  label.textContent = currentDate.toLocaleString("default", {
    month: "long",
    year: "numeric"
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // Empty cells before month starts
  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendar.appendChild(empty);
  }

  // Actual days
  for (let d = 1; d <= daysInMonth; d++) {
    const day = document.createElement("div");
    day.className = "day";
    day.textContent = d;

    if (
      d === new Date().getDate() &&
      month === new Date().getMonth() &&
      year === new Date().getFullYear()
    ) {
      day.classList.add("selected");
    }

    calendar.appendChild(day);
  }
}

function changeMonth(offset) {
  currentDate.setMonth(currentDate.getMonth() + offset);
  renderCalendar();
}

renderCalendar();
</script>

</body>
</html>
```
